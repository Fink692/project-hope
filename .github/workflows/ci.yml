name: Project Hope quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ai-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements.txt
      - run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt
      - run: python -m unittest -v

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt
      - run: python manage.py check
      - run: python manage.py check --deploy
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-X8q2Vn9Lm4Rp7Ts6Wz1Yc5Ka9Hd3Fg8Jm2Qv6Bt7Ne4Px9Rc3Wy5Ua8Kz1Dh6Fs0Jv
          PROJECT_HOPE_MFA_ENCRYPTION_KEYS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          DJANGO_ALLOWED_HOSTS: example.org
          DJANGO_TRUST_PROXY: "true"
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.org
          DATABASE_URL: postgresql://hope:ci-only@localhost:5432/hope
          SMTP_HOST: smtp.example.org
          SMTP_FROM: Project Hope <noreply@example.org>
          PROJECT_HOPE_PUBLIC_URL: https://example.org
          VALKEY_URL: redis://localhost:6379/0
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: python manage.py test -v 1

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hope
          POSTGRES_USER: hope
          POSTGRES_PASSWORD: hope-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope -d hope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/core
    env:
      DATABASE_URL: postgresql://hope:hope-ci-password@127.0.0.1:5432/hope
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test -v 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec tsc -p ../../packages/api-client/tsconfig.json

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check the real website in a browser
        run: |
          pnpm start --port 5180 > /tmp/hope-site.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:5180 > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:e2e

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:security
      - run: pnpm audit --prod --ignore GHSA-w3rx-r6r6-pgpr --ignore GHSA-5p2g-fcmc-qvqq
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec expo export --platform web --output-dir .expo-export-ci

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/requirements-desktop.txt
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm test
      - run: python -m pip install -r ../../services/core/requirements-desktop.txt pip-audit==2.10.1
      - run: python -m pip_audit -r ../../services/core/requirements-desktop.txt
      - run: pnpm --dir ../web install --frozen-lockfile
      - run: pnpm build:bundle
      - run: pnpm test:runtime

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/podman/compose.yml config -q

  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate public launch materials
        run: python3 scripts/check_launch_docs.py
      - name: Validate charity setup helper
        run: bash -n scripts/project-hope.sh && bash scripts/project-hope.sh help
      - name: Validate Windows helper help path
        shell: pwsh
        run: ./scripts/project-hope.ps1 help

  production-compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      DJANGO_SECRET_KEY: ci-only-production-secret-with-sufficient-entropy-123456789
      PROJECT_HOPE_MFA_ENCRYPTION_KEYS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DJANGO_ALLOWED_HOSTS: example.org
      DJANGO_CSRF_TRUSTED_ORIGINS: https://example.org
      DATABASE_URL: postgresql://hope:ci-postgres-password@db:5432/hope
      SMTP_HOST: smtp.example.org
      SMTP_FROM: Project Hope <noreply@example.org>
      PROJECT_HOPE_PUBLIC_URL: https://example.org
      AI_GATEWAY_TOKEN: ci-gateway-token
      HOPE_DOMAIN: example.org
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/podman/compose.production.yml config -q
