name: Project Hope quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py check --deploy
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-X8q2Vn9Lm4Rp7Ts6Wz1Yc5Ka9Hd3Fg8Jm2Qv6B
          DJANGO_ALLOWED_HOSTS: example.org
          DJANGO_TRUST_PROXY: "true"
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.org
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: python manage.py test -v 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec tsc -p ../../packages/api-client/tsconfig.json

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec expo export --platform web --output-dir .expo-export-ci

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/podman/compose.yml config -q

  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate charity setup helper
        run: bash -n scripts/project-hope.sh && bash scripts/project-hope.sh help
      - name: Validate Windows helper help path
        shell: pwsh
        run: ./scripts/project-hope.ps1 help

  production-compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      DJANGO_SECRET_KEY: ci-only-production-secret-with-sufficient-entropy-123456789
      DJANGO_ALLOWED_HOSTS: example.org
      DJANGO_CSRF_TRUSTED_ORIGINS: https://example.org
      DATABASE_URL: postgresql://hope:ci-postgres-password@db:5432/hope
      SMTP_HOST: smtp.example.org
      SMTP_FROM: Project Hope <noreply@example.org>
      AI_GATEWAY_TOKEN: ci-gateway-token
      HOPE_DOMAIN: example.org
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/podman/compose.production.yml config -q
