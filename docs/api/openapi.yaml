openapi: 3.1.0
info:
  title: Project Hope API
  version: 1.9.2
  description: Tenant-bound API for self-hosted charity operations.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - tokenAuth: []
paths:
  /healthz/:
    get:
      security: []
      summary: Health and database readiness
      responses:
        '200': { description: Healthy }
  /me/:
    get:
      summary: Current user, MFA policy, and active organizations
      description: Required but incomplete MFA enrollment returns an empty organizations list and workspaceAccessGranted false.
      responses:
        '200': { description: Identity and memberships }
  /auth/csrf/:
    get:
      security: []
      summary: Set the browser CSRF cookie before session login
      responses:
        '200': { description: CSRF cookie is available }
  /auth/login/:
    post:
      security: []
      summary: Create a CSRF-protected browser session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated browser user }
        '202': { description: Password accepted; a short-lived MFA challenge is required }
        '400': { description: Invalid credentials }
        '403': { description: CSRF check failed }
        '429': { description: Per-account or IP login limit reached }
  /auth/token/:
    post:
      security: []
      summary: Exchange credentials for a native-client API token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated user and token }
        '202': { description: Password accepted; a short-lived MFA challenge is required }
        '400': { description: Invalid credentials }
        '429': { description: Per-account or IP login limit reached }
  /auth/mfa/challenge/:
    post:
      security: []
      summary: Complete a browser or native sign-in with TOTP or a one-time recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge, code]
              properties:
                challenge: { type: string, maxLength: 2048 }
                code: { type: string, maxLength: 32 }
      responses:
        '200': { description: Session created or native token issued }
        '400': { description: Challenge invalid, expired, replayed, or code rejected }
        '403': { description: Browser CSRF check failed }
        '429': { description: Challenge or IP attempt limit reached }
  /auth/mfa/:
    get:
      summary: Read two-step verification and recovery-code status
      responses:
        '200': { description: MFA status, policy, enrollment requirement, and remaining code count }
  /auth/mfa/enrollment/:
    post:
      summary: Begin a password-confirmed TOTP enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password]
              properties:
                current_password: { type: string, maxLength: 256, format: password }
      responses:
        '200': { description: Private expiring setup payload, manual secret, and locally generated QR data URL }
        '400': { description: Current password rejected }
        '409': { description: MFA is already enabled }
        '429': { description: Enrollment attempt limit reached }
  /auth/mfa/enrollment/confirm/:
    post:
      summary: Confirm TOTP enrollment and return recovery codes once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enrollment_token, code]
              properties:
                enrollment_token: { type: string, maxLength: 4096 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '201': { description: MFA enabled; old sessions and native tokens superseded }
        '400': { description: Setup invalid, expired, or code rejected }
        '409': { description: MFA is already enabled }
  /auth/mfa/recovery-codes/:
    post:
      summary: Replace every recovery code after password and MFA verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaStepUpRequest' }
      responses:
        '200': { description: New one-time recovery codes returned once; earlier codes invalidated }
        '400': { description: Password or verification code rejected }
  /auth/mfa/disable/:
    post:
      summary: Disable MFA after password and MFA verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaStepUpRequest' }
      responses:
        '200': { description: MFA disabled and old sessions/native tokens superseded }
        '400': { description: Password or verification code rejected }
  /auth/password-reset/:
    post:
      security: []
      summary: Request a privacy-preserving password reset email
      responses:
        '202': { description: Generic response regardless of account existence }
        '429': { description: Request limit reached }
  /auth/password-reset/inspect/:
    post:
      security: []
      summary: Validate password reset credentials without changing the account
      responses:
        '200': { description: Reset credentials are valid }
        '400': { description: Reset credentials invalid or expired }
  /auth/password-reset/confirm/:
    post:
      security: []
      summary: Set a policy-validated password and revoke the API token
      responses:
        '200': { description: Password changed and existing sessions invalidated }
        '400': { description: Invalid credentials or password policy failure }
  /invitations/inspect/:
    post:
      security: []
      summary: Inspect an expiring organization invitation
      responses:
        '200': { description: Invitation metadata }
        '400': { description: Invitation invalid, expired, revoked, or used }
  /invitations/accept/:
    post:
      security: []
      summary: Accept an invitation and create an account when required
      responses:
        '200': { description: Membership active }
        '400': { description: Invalid invitation or password }
  /organizations/{slug}/members/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }]
    get: { summary: List organization memberships, responses: { '200': { description: Memberships } } }
  /organizations/{slug}/members/{membershipId}/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }, { $ref: '#/components/parameters/MembershipId' }]
    patch: { summary: Change a member role or active status, responses: { '200': { description: Membership updated }, '400': { description: Invalid change or last-owner protection }, '403': { description: Owner or administrator permission required } } }
  /organizations/{slug}/invitations/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }]
    get: { summary: List invitations for an owner or administrator, responses: { '200': { description: Invitations } } }
    post: { summary: Send or refresh an expiring invitation, responses: { '201': { description: Invitation created }, '200': { description: Pending invitation refreshed } } }
  /organizations/{slug}/invitations/{invitationId}/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }, { $ref: '#/components/parameters/InvitationId' }]
    delete: { summary: Revoke a pending invitation, responses: { '204': { description: Invitation revoked }, '400': { description: Invitation is not pending }, '403': { description: Owner or administrator permission required } } }
  /organizations/{slug}/invitations/{invitationId}/resend/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }, { $ref: '#/components/parameters/InvitationId' }]
    post: { summary: Rotate and resend a pending invitation, responses: { '200': { description: Invitation rotated and delivery attempted }, '400': { description: Invitation is not pending }, '403': { description: Owner or administrator permission required } } }
  /pilot-applications/:
    post:
      security: []
      summary: Apply to the Founding 10 pilot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PilotApplicationRequest' }
      responses:
        '202': { description: Application accepted with a generic privacy-preserving response }
        '400': { description: Invalid input or missing consent }
        '429': { description: Submission rate limit reached }
  /pilot-applications/verify/:
    post:
      security: []
      summary: Confirm a pilot application email using an expiring signed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 2048 }
      responses:
        '200': { description: Email confirmed }
        '400': { description: Token invalid or expired }
        '429': { description: Verification rate limit reached }
  /pilot-applications/metrics/:
    get:
      summary: Privacy-safe Founding 10 conversion counts for administrators
      responses:
        '200': { description: Aggregate application, verification, qualification, pilot, and conversion counts }
        '403': { description: Administrator access required }
  /organizations/{slug}/contacts/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }]
    get: { summary: List active tenant contacts, responses: { '200': { description: Contacts } } }
    post: { summary: Create a tenant contact, responses: { '201': { description: Created }, '403': { description: Editing role required } } }
  /organizations/{slug}/contacts/{id}/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }, { $ref: '#/components/parameters/Id' }]
    get: { summary: Read one tenant contact, responses: { '200': { description: Contact }, '404': { description: Contact is unavailable in this organization } } }
    patch: { summary: Correct a tenant contact, responses: { '200': { description: Contact updated }, '403': { description: Editing role required }, '404': { description: Contact is unavailable in this organization } } }
  /organizations/{slug}/crm/imports/preview/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }]
    post:
      summary: Privately preview a CSV, TSV, or XLSX contact import without changing records
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Short-lived user-, tenant-, and file-bound review payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactImportPreview' }
        '400': { description: Invalid columns, workbook, archive, or CSV content }
        '403': { description: Owner or administrator permission required }
        '413': { description: Configured file, row, archive, or expansion limit exceeded }
        '415': { description: Unsupported file type }
  /organizations/{slug}/crm/imports/commit/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }]
    post:
      summary: Revalidate the same file and commit explicitly reviewed contact actions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, previewToken, actions]
              properties:
                file: { type: string, format: binary }
                previewToken: { type: string, maxLength: 4096 }
                actions: { type: string, description: JSON array of rowNumber plus create, skip, or update action and optional targetContactId. }
      responses:
        '201':
          description: Reviewed import committed atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactImportResult' }
        '400': { description: Invalid action or import data }
        '403': { description: Owner or administrator permission required }
        '409': { description: Preview expired, file changed, or a reviewed match is no longer current }
        '413': { description: Configured import limit exceeded }
  /organizations/{slug}/crm/template/:
    parameters:
      - { $ref: '#/components/parameters/OrganizationSlug' }
      - { name: fileFormat, in: query, schema: { type: string, enum: [xlsx, csv], default: xlsx } }
    get:
      summary: Download a guided contact migration template
      responses:
        '200':
          description: Excel workbook or UTF-8 CSV template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string, format: binary } }
        '403': { description: Editing role required }
  /organizations/{slug}/crm/export/:
    parameters:
      - { $ref: '#/components/parameters/OrganizationSlug' }
      - { name: fileFormat, in: query, schema: { type: string, enum: [xlsx, csv], default: xlsx } }
      - { name: includeMerged, in: query, schema: { type: boolean, default: false } }
    get:
      summary: Export active contacts in a spreadsheet-safe portable format
      responses:
        '200':
          description: Excel workbook or UTF-8 BOM CSV export
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string, format: binary } }
        '403': { description: Owner or administrator permission required }
  /organizations/{slug}/crm/duplicates/:
    parameters:
      - { $ref: '#/components/parameters/OrganizationSlug' }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
    get:
      summary: Review deterministic exact, strong, and possible duplicate contact pairs
      responses:
        '200':
          description: Duplicate candidate pairs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDuplicateReview' }
        '403': { description: Owner or administrator permission required }
  /organizations/{slug}/crm/duplicates/merge/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }]
    post:
      summary: Preserve and merge a reviewed duplicate contact into the selected active contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMergeRequest' }
      responses:
        '200':
          description: Source record preserved and linked records reassigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactMergeResult' }
        '400': { description: Explicit confirmation or valid identifiers missing }
        '403': { description: Owner or administrator permission required }
        '404': { description: Either contact is unavailable in this organization }
        '409': { description: Both contacts have volunteer profiles or records changed }
        '423': { description: Contact legal hold prevents merge }
  /organizations/{slug}/workflows/{id}/review/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }, { $ref: '#/components/parameters/Id' }]
    post: { summary: Approve or reject a bounded workflow, responses: { '200': { description: Reviewed } } }
  /organizations/{slug}/ai/v1/{operation}/:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }, { name: operation, in: path, required: true, schema: { type: string } }]
    post: { summary: Run one bounded local AI operation, responses: { '200': { description: Structured workflow result } } }
  /public/v1/resources/:
    get:
      security:
        - clientHeaders: []
          clientSecret: []
      summary: Read verified community resources with a scoped API client
      responses:
        '200': { description: Resource results }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: sessionid }
    tokenAuth: { type: apiKey, in: header, name: Authorization, description: "Use Token <key>." }
    clientHeaders: { type: apiKey, in: header, name: X-Project-Hope-Client }
    clientSecret: { type: apiKey, in: header, name: X-Project-Hope-Secret }
  parameters:
    OrganizationSlug: { name: slug, in: path, required: true, schema: { type: string } }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    MembershipId: { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, maxLength: 256 }
    MfaStepUpRequest:
      type: object
      additionalProperties: false
      required: [current_password, code]
      properties:
        current_password: { type: string, format: password, maxLength: 256 }
        code: { type: string, maxLength: 32, description: Current TOTP or unused recovery code. }
    PilotApplicationRequest:
      type: object
      additionalProperties: false
      required: [contact_name, email, organization_name, team_size, primary_need, plan_interest, consent_to_contact]
      properties:
        contact_name: { type: string, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        organization_name: { type: string, maxLength: 200 }
        website: { type: string, format: uri, maxLength: 500 }
        country_or_region: { type: string, maxLength: 120 }
        team_size: { type: string, enum: ['1', '2-5', '6-20', '21-50', '51+'] }
        primary_need: { type: string, enum: [operations, volunteers, grants, communications, impact, accessibility, other] }
        plan_interest: { type: string, enum: [community, founding_partner, network] }
        notes: { type: string, maxLength: 2000 }
        consent_to_contact: { type: boolean, const: true }
        source: { type: string, enum: [website, linkedin, partner, referral, direct, other] }
        utm_source: { type: string, maxLength: 120 }
        utm_medium: { type: string, maxLength: 120 }
        utm_campaign: { type: string, maxLength: 160 }
        referrer: { type: string, format: uri, maxLength: 500 }
        company_website: { type: string, maxLength: 500, description: Bot-detection honeypot; real clients leave this empty. }
    ContactCandidate:
      type: object
      required: [id, displayName, contactType, email, phone, sensitivity, consentStatus, matchReasons]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        contactType: { type: string, enum: [person, organization, service_user, donor, volunteer] }
        firstName: { type: string }
        lastName: { type: string }
        organizationName: { type: string }
        email: { type: string }
        phone: { type: string }
        externalRef: { type: string }
        sensitivity: { type: string, enum: [public, internal, confidential, highly_sensitive, restricted] }
        consentStatus: { type: string, enum: [unknown, granted, withdrawn] }
        updatedAt: { type: string, format: date-time }
        matchReasons: { type: array, items: { type: string } }
    ContactImportRow:
      type: object
      required: [rowNumber, status, values, providedFields, errors, candidates, recommendedAction]
      properties:
        rowNumber: { type: integer, minimum: 2 }
        status: { type: string, enum: [new, exact_match, possible_duplicate, invalid] }
        values: { type: object, additionalProperties: { type: string } }
        providedFields: { type: array, items: { type: string } }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
        candidates: { type: array, items: { $ref: '#/components/schemas/ContactCandidate' } }
        recommendedAction: { type: string, enum: [create, skip] }
    ContactImportPreview:
      type: object
      required: [schemaVersion, fileName, fileType, fileSha256, summary, warnings, rows, expiresInSeconds, previewToken]
      properties:
        schemaVersion: { type: integer }
        fileName: { type: string }
        fileType: { type: string, enum: [csv, xlsx] }
        fileSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        columns: { type: array, items: { type: string } }
        summary:
          type: object
          required: [totalRows, newRecords, exactMatches, possibleDuplicates, invalidRows]
          properties:
            totalRows: { type: integer, minimum: 0 }
            newRecords: { type: integer, minimum: 0 }
            exactMatches: { type: integer, minimum: 0 }
            possibleDuplicates: { type: integer, minimum: 0 }
            invalidRows: { type: integer, minimum: 0 }
        warnings: { type: array, items: { type: string } }
        rows: { type: array, items: { $ref: '#/components/schemas/ContactImportRow' } }
        expiresInSeconds: { type: integer, minimum: 1 }
        previewToken: { type: string }
    ContactImportResult:
      type: object
      required: [created, updated, unchanged, skipped, invalid, createdIds, updatedIds, fileSha256]
      properties:
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        invalid: { type: integer, minimum: 0 }
        createdIds: { type: array, items: { type: string, format: uuid } }
        updatedIds: { type: array, items: { type: string, format: uuid } }
        fileSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    ContactDuplicateReview:
      type: object
      required: [totalActiveContacts, totalCandidates, results]
      properties:
        totalActiveContacts: { type: integer, minimum: 0 }
        totalCandidates: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            type: object
            required: [first, second, matchReasons, confidence]
            properties:
              first: { $ref: '#/components/schemas/ContactCandidate' }
              second: { $ref: '#/components/schemas/ContactCandidate' }
              matchReasons: { type: array, items: { type: string } }
              confidence: { type: string, enum: [exact, strong, possible] }
    ContactMergeRequest:
      type: object
      additionalProperties: false
      required: [primaryContactId, duplicateContactId, confirm]
      properties:
        primaryContactId: { type: string, format: uuid }
        duplicateContactId: { type: string, format: uuid }
        confirm: { type: boolean, const: true }
    ContactMergeResult:
      type: object
      required: [primary, mergedContactId, reassigned, preserved]
      properties:
        primary: { $ref: '#/components/schemas/ContactCandidate' }
        mergedContactId: { type: string, format: uuid }
        reassigned:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        preserved: { type: boolean, const: true }
